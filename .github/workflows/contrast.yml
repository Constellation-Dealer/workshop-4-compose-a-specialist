name: contrast

# The exercise UI is read in a bright room, on 31 laptops nobody has calibrated. Faint
# text does not get reported as a bug -- people just quietly lose track of what the agent
# loop is doing, which is the one thing the page exists to show.
#
# This runs on every push and PR because the palette is the kind of thing that gets
# adjusted casually. It derives the colours it checks FROM the stylesheet, so it covers a
# rule written after it, and it needs no dependencies -- ubuntu-latest ships python3.

on:
  push:
    branches: [main, solution]
  pull_request:
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check-contrast.py styles.css

      # Added after a redesign deleted two element ids and left the scripts
      # reaching for them. That threw on every load and looked fine, because
      # loadEnv() is async and unawaited — the page rendered, then died quietly.
      # CI could not see it: the only check here was CSS contrast.
      - run: python3 .github/scripts/check-dom-ids.py

      # Static checks cannot see a state transition. Both bugs this covers
      # shipped and looked correct in a browser: the incomplete-config gate was
      # undone by the first failed chip click, and the documented CONSOLE_URL
      # override was read before .env was parsed, so it was silently ignored.
      - run: node .github/scripts/check-page-state.js
